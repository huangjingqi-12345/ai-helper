# ============================================
# Px Lite 药企患教内容运营与行为洞察平台 — Docker Compose
# ============================================

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pxlite-${DEPLOY_ENV:-local}-frontend
    ports:
      # Override FRONTEND_HOST_PORT per deployment environment.
      # Defaults:
      #   local/development: 9973
      #   dev: 31002, sit: 31003, uat: 31004 (set by scripts/deploy.sh/env files)
      - "${FRONTEND_HOST_PORT:-9973}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pxlite

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pxlite-${DEPLOY_ENV:-local}-backend
    # Do not publish the backend port to the host.
    # Frontend nginx reaches it through the Docker network as http://backend:3001.
    # Health checks/scripts use `docker compose exec backend ...` instead of host ports.
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_CLIENT=sqlite
      - DB_PATH=/app/data/pxlite.db
      # This compose file is the local demo stack; seed sample data so the UI has content.
      - RUN_DEMO_SEED=true
      # Demo stack: frontend has no login screen, so allow backend dev user fallback.
      # Disable this and provide OIDC settings for real production auth.
      - ALLOW_DEMO_AUTH=true
      # Approval attachments are loaded by backend through the DX content-detail API.
      # Local demo can fall back to the SQLite content cache when DX is not configured.
      # Doctor candidates are loaded from DX via DX_DOCTORS_PATH when DX_API_BASE_URL is set.
      - DX_API_BASE_URL=${DX_API_BASE_URL:-}
      - DX_DOCTORS_PATH=${DX_DOCTORS_PATH:-/api/px/doctors}
      - DX_CONTENT_DETAIL_PATH_TEMPLATE=${DX_CONTENT_DETAIL_PATH_TEMPLATE:-/content/{contentId}}
      - DX_API_TOKEN=${DX_API_TOKEN:-123456789abcdef}
      - DX_API_KEY=${DX_API_KEY:-}
      - DX_API_TIMEOUT_MS=${DX_API_TIMEOUT_MS:-5000}
      - DX_CONTENT_FALLBACK=${DX_CONTENT_FALLBACK:-local}
      - CX_API_BASE_URL=${CX_API_BASE_URL:-}
      - CX_PHARMA_ACCESS_TOKEN=${CX_PHARMA_ACCESS_TOKEN:-}
      - CX_API_TIMEOUT_MS=${CX_API_TIMEOUT_MS:-10000}
      - CX_SYNC_HOUR=${CX_SYNC_HOUR:-2}
    volumes:
      - pxlite-db:/app/data
      - pxlite-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/api/ready"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - pxlite

volumes:
  pxlite-db:
    driver: local
  pxlite-logs:
    driver: local

networks:
  pxlite:
    driver: bridge
