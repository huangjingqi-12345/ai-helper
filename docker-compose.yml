# ============================================
# Px Lite 极简版平台 — Docker Compose
# ============================================

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pxlite-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pxlite

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pxlite-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/pxlite.db
    volumes:
      - pxlite-db:/app/data
      - pxlite-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - pxlite

volumes:
  pxlite-db:
    driver: local
  pxlite-logs:
    driver: local

networks:
  pxlite:
    driver: bridge
