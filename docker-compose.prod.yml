# ============================================
# Px Lite — Release Docker Compose override
#
# Usage:
#   cp .env.compose.dev.example .env.compose.dev.local
#   ./scripts/deploy.sh dev
#
#   cp .env.compose.sit.example .env.compose.sit.local
#   ./scripts/deploy.sh sit
#
#   cp .env.compose.uat.example .env.compose.uat.local
#   ./scripts/deploy.sh uat
#
#   cp .env.compose.production.example .env.compose.production.local
#   ./scripts/deploy.sh production
# ============================================

services:
  backend:
    environment:
      # Production uses PostgreSQL. Use a Node/Postgres DSN such as:
      # postgresql://user:password@host:5432/database
      # If you received a SQLAlchemy/Python DSN like postgresql+psycopg://...,
      # remove "+psycopg" before using it here.
      DB_CLIENT: postgres
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required for production PostgreSQL}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      PGSSLMODE: ${PGSSLMODE:-disable}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}

      # Production should not seed demo data or allow unauthenticated demo fallback
      # unless you intentionally override these values for a demo environment.
      RUN_DEMO_SEED: ${RUN_DEMO_SEED:-false}
      ALLOW_DEMO_AUTH: ${ALLOW_DEMO_AUTH:-false}

      # Required for approval attachments: PX backend calls DX content detail API.
      # Required for doctor candidates: PX backend calls DX doctor list API.
      DX_API_BASE_URL: ${DX_API_BASE_URL:?DX_API_BASE_URL is required for approval attachments}
      DX_DOCTORS_PATH: ${DX_DOCTORS_PATH:-/api/px/doctors}
      DX_CONTENT_DETAIL_PATH_TEMPLATE: ${DX_CONTENT_DETAIL_PATH_TEMPLATE:-/content/{contentId}}
      DX_API_TOKEN: ${DX_API_TOKEN:-}
      DX_API_KEY: ${DX_API_KEY:-}
      DX_API_TIMEOUT_MS: ${DX_API_TIMEOUT_MS:-5000}
      DX_CONTENT_FALLBACK: ${DX_CONTENT_FALLBACK:-none}

      # Required for patient-side behavior stats: PX pulls aggregate PV/UV/interaction
      # snapshots from CX /api/pharma-access/* with this shared token.
      CX_API_BASE_URL: ${CX_API_BASE_URL:?CX_API_BASE_URL is required for CX stats sync}
      CX_PHARMA_ACCESS_TOKEN: ${CX_PHARMA_ACCESS_TOKEN:?CX_PHARMA_ACCESS_TOKEN is required for CX stats sync}
      CX_API_TIMEOUT_MS: ${CX_API_TIMEOUT_MS:-10000}
      CX_SYNC_HOUR: ${CX_SYNC_HOUR:-2}
